<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcards</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Vokabelkarten</h1>
      <form id="word-pair-form">
        <label for="english-word">Englisch</label>
        <input id="english-word" name="english" type="text" required>

        <label for="german-word">Deutsch</label>
        <input id="german-word" name="german" type="text" required>

        <p id="form-error" role="alert" hidden></p>
        <button type="submit">OK</button>
      </form>

      <h2>Gespeicherte Wortpaare</h2>
      <ul id="word-pair-list"></ul>

      <h2>Übungsmodus</h2>
      <section id="practice-section">
        <p id="practice-english"></p>
        <p id="practice-german" hidden></p>
        <p id="practice-empty" hidden>Keine Wortpaare vorhanden.</p>
        <button id="reveal-button" type="button">Deutsche Übersetzung anzeigen</button>
        <button id="next-button" type="button">Nächste Karte</button>
      </section>
    </main>
  </body>
</html>
