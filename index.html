<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radiographer Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Radiographer Companion</p>
    <h1>Untersuchungsprotokolle</h1>
    <p>Übersicht der verfügbaren Untersuchungen</p>
  </header>

  <main class="page-content">
    <div class="page-layout">
      <aside class="search-panel" aria-label="Protokolle durchsuchen">
        <label for="protocol-search">Suche</label>
        <input
          id="protocol-search"
          type="search"
          placeholder="Untersuchung, Lagerung oder CAVE"
          autocomplete="off"
        >
        <fieldset class="filter-group">
          <legend>Modalität</legend>
          <button class="filter-button is-active" type="button" data-modality="Alle">Alle</button>
          <button class="filter-button" type="button" data-modality="Röntgen">Röntgen</button>
          <button class="filter-button" type="button" data-modality="CT">CT</button>
          <button class="filter-button" type="button" data-modality="MRT">MRT</button>
        </fieldset>
        <fieldset class="filter-group">
          <legend>Körperregion</legend>
          <button class="filter-button is-active" type="button" data-region="Alle">Alle</button>
          <button class="filter-button" type="button" data-region="Thorax">Thorax</button>
          <button class="filter-button" type="button" data-region="Abdomen">Abdomen</button>
          <button class="filter-button" type="button" data-region="Obere Extremität">Obere Extremität</button>
          <button class="filter-button" type="button" data-region="Untere Extremität">Untere Extremität</button>
          <button class="filter-button" type="button" data-region="Wirbelsäule">Wirbelsäule</button>
          <button class="filter-button" type="button" data-region="Kopf">Kopf</button>
        </fieldset>
      </aside>
      <div class="protocol-results">
        <p id="load-status" class="load-status" role="status" aria-live="polite">
          Protokolle werden geladen …
        </p>
        <button id="reset-filters" class="reset-filters-button" type="button" hidden>
          Alle Filter zurücksetzen
        </button>
        <section id="protocol-list" class="protocol-grid" aria-label="Untersuchungsprotokolle"></section>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
