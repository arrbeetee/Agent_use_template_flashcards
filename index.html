<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radiographer Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Radiographer Companion</p>
    <h1>Untersuchungsprotokolle</h1>
    <p>Übersicht der verfügbaren Untersuchungen</p>
  </header>

  <main class="page-content">
    <div class="page-layout">
      <aside class="search-panel" aria-label="Protokolle durchsuchen">
        <label for="protocol-search">Suche</label>
        <input
          id="protocol-search"
          type="search"
          placeholder="Untersuchung, Lagerung oder CAVE"
          autocomplete="off"
        >
      </aside>
      <div class="protocol-results">
        <p id="load-status" class="load-status" role="status" aria-live="polite">
          Protokolle werden geladen …
        </p>
        <section id="protocol-list" class="protocol-grid" aria-label="Untersuchungsprotokolle"></section>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
